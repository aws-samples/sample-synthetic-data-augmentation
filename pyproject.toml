[project]
name = "synthetic-data-augmentation"
version = "0.1.0"
description = "Synthetic data augmentation for YOLO object detection"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=0.34.0",
    "boto3>=1.42.2",
    "click>=8.0.0",
    "diffusers>=0.32.0",
    "kernels>=0.4.0",
    "matplotlib>=3.10.7",
    "numpy<2.3.0",
    "opencv-python>=4.8.0",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "polars>=1.35.2",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "s3fs>=2024.6.1",
    "sagemaker>=2.200.0",
    "torch==2.7.1",
    "tqdm>=4.66.0",
    "transformers>=4.44.0",
    "ultralytics>=8.3.232",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.5.0",
    "ruff>=0.14.6",
]

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers", rev = "256e0106749363fce06c28000698edeaf56a874d" }

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportMissingImports = false
